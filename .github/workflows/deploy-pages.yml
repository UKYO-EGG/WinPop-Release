name: WinPop Pages を展開する

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pages_public/**"
      - ".github/workflows/deploy-pages.yml"
      - "README.md"

concurrency:
  group: winpop-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate stats.json
        run: python scripts/update_release_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pages_public --project-name winpop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
